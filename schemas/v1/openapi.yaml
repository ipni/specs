openapi: 3.0.3
info:
  title: IPNI HTTP API
  description: The Interplanetary Network Indexer (IPNI) HTTP query API.
  version: 0.0.1
paths:
  /cid/{cid}:
    get:
      description: Finds provider records for a given CID by extracting its multihash.
      parameters:
        - name: cid
          in: path
          description: The string representation of the CID.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cascade'
      responses:
        '200':
          description: At least one provider was found successfully.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FindResponse'
              examples:
                providerRecords:
                  $ref: '#/components/examples/JsonFindResponse'
            'application/x-ndjson':
              schema:
                $ref: '#/components/schemas/ProviderRecord'
              examples:
                providerRecords:
                  $ref: '#/components/examples/NDJsonProviderRecords'
        '400':
          description: The given request is not valid.
          content:
            text/plain: { }
        '404':
          description: No results were found for the given CID.
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
  /cid:
    options:
      description: Returns permitted communication options for lookup by CID.
      responses:
        '204':
          $ref: '#/components/responses/FindOptions'
  /multihash/{multihash}:
    get:
      description: Finds provider records for a given multihash
      parameters:
        - name: multihash
          in: path
          description: The base58 or hex string representation of the multihash.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Cascade'
      responses:
        '200':
          description: At least one provider was found successfully.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FindResponse'
              examples:
                providerRecords:
                  $ref: '#/components/examples/JsonFindResponse'
            'application/x-ndjson':
              schema:
                $ref: '#/components/schemas/ProviderRecord'
              examples:
                providerRecords:
                  $ref: '#/components/examples/NDJsonProviderRecords'
        '400':
          description: The given request is not valid.
          content:
            text/plain: { }
        '404':
          description: No results were found for the given multihash.
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
  /multihash:
    options:
      description: Returns permitted communication options for lookup by multihash.
      responses:
        '204':
          $ref: '#/components/responses/FindOptions'
    post:
      description: Batch finds provider records for a given set of multihashes
      requestBody:
        description: Callback payload
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/FindResponse'
            examples:
              providerRecords:
                $ref: '#/components/examples/JsonFindResponseMultiple'
      responses:
        '200':
          description: At least one provider was found successfully.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FindResponse'
        '400':
          description: The given request is not valid.
          content:
            text/plain: { }
        '404':
          description: No results were found for any of the given multihashs.
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
  /sync/status:
    get:
      description: Lists live sync status for all publishers currently tracked by the indexer.
      responses:
        '200':
          description: Sync status was found for at least one publisher.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SyncStatusMap'
              examples:
                syncStatuses:
                  $ref: '#/components/examples/SyncStatusMapResponse'
        '204':
          description: No sync status is currently tracked for any publisher.
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
  /sync/status/{peerID}:
    get:
      description: Returns the live sync status for a single publisher, identified by its libp2p peer ID.
      parameters:
        - name: peerID
          in: path
          description: The string representation of the publisher's libp2p peer ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync status was found for the given publisher.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SyncStatus'
              examples:
                syncStatus:
                  $ref: '#/components/examples/SyncStatusResponse'
        '204':
          description: No sync status is currently tracked for the given publisher.
        '400':
          description: The given peer ID could not be decoded.
          content:
            text/plain: { }
  /sync/status/ad:
    post:
      description: |
        Looks up several advertisements at once and reports whether each one's
        content is available from this indexer.

        Send 1 to 128 advertisement CIDs. Results are returned in the same
        order as `Ads`. Duplicates are allowed; each position gets its own
        result.

        If one CID in the list is invalid, that entry includes an `Error` and
        the rest of the response is still returned with HTTP 200. Prefer
        `GET /sync/status/ad/{cid}` when checking a single advertisement; that
        response can be cached.
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/BatchAdStatusRequest'
            examples:
              ads:
                $ref: '#/components/examples/JsonBatchAdStatusRequest'
      responses:
        '200':
          description: |
            A status was produced for every requested CID, in request order.
            HTTP 200 is returned even when some entries have an `Error`.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/BatchAdStatusResponse'
              examples:
                statuses:
                  $ref: '#/components/examples/JsonBatchAdStatusResponse'
        '400':
          description: |
            The request is not valid: `Ads` is missing or empty, more than 128
            CIDs were sent, the body is too large, or the JSON could not be
            parsed.
          content:
            text/plain: { }
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
        '503':
          description: Advertisement status is temporarily unavailable.
          content:
            text/plain: { }
  /sync/status/ad/{cid}:
    get:
      description: |
        Looks up a single advertisement by CID and reports whether its content
        is available from this indexer.

        Use an advertisement CID (dag-json or dag-cbor). To find providers for
        content, use `GET /cid/{cid}` instead.
      parameters:
        - name: cid
          in: path
          description: |
            Advertisement CID. Must use the dag-json or dag-cbor codec.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            The advertisement was looked up. An advertisement this indexer has
            never seen still returns 200, with `Indexed` false and `State`
            `"unknown"`.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AdStatus'
              examples:
                indexed:
                  $ref: '#/components/examples/AdStatusResponse'
                skipped:
                  $ref: '#/components/examples/AdStatusSkippedResponse'
        '400':
          description: |
            The CID could not be decoded, or it is not an advertisement CID
            (dag-json or dag-cbor).
          content:
            text/plain: { }
        '500':
          description: Failure occurred while processing the request.
          content:
            text/plain: { }
        '503':
          description: Advertisement status is temporarily unavailable.
          content:
            text/plain: { }
components:
  schemas:
    FindResponse:
      type: array
      items:
        $ref: '#/components/schemas/MultihashResults'
    MultihashResults:
      type: array
      items:
        type: object
        properties:
          Multihash:
            type: string
            description: base64 string representation of the queried multihash
          ProviderResults:
            type: array
            items:
              $ref: '#/components/schemas/ProviderRecord'
    ProviderRecord:
      type: object
      properties:
        ContextID:
          type: string
          description: base64 encoded context ID.
        Metadata:
          type: string
          description: base64 encoded metadata.
        Provider:
          type: object
          properties:
            ID:
              type: string
              description: encoded libp2p peer ID of the provider.
            Addrs:
              type: array
              items:
                type: string
                description: string representation of the provider multiaddr.
    FindRequest:
      type: object
      properties:
        Multihashes:
          type: array
          description: the list of multihashes for which to find providers.
          items:
            type: string
            description: base64 string representation of the multihash.
    SyncStatusMap:
      type: object
      description: |
        Sync statuses keyed by publisher peer ID; each value is the sync status
        for that publisher.
      additionalProperties:
        $ref: '#/components/schemas/SyncStatus'
    SyncStatus:
      type: object
      description: |
        Live sync progress for a single publisher. Reflects one main provider
        (the advertisement's Provider) at a time; extended providers are not
        tracked. Each phase carries a current run while active and a bounded
        history of recent completed runs, at most ten per phase. Fields are
        omitted when empty.
      properties:
        Provider:
          type: string
          description: Encoded libp2p peer ID of the main provider for the tracked advertisements.
        Scan:
          $ref: '#/components/schemas/SyncScanRun'
        ScanHistory:
          type: array
          items:
            $ref: '#/components/schemas/SyncScanRun'
        Processing:
          $ref: '#/components/schemas/SyncProcessingRun'
        ProcessingHistory:
          type: array
          items:
            $ref: '#/components/schemas/SyncProcessingRun'
        Download:
          $ref: '#/components/schemas/SyncDownloadRun'
        DownloadHistory:
          type: array
          items:
            $ref: '#/components/schemas/SyncDownloadRun'
    SyncScanRun:
      type: object
      description: Progress of a single advertisement-chain scan.
      properties:
        StartTime:
          type: string
          format: date-time
          description: RFC3339 time at which the scan started.
        EndTime:
          type: string
          format: date-time
          description: RFC3339 time at which the scan ended; omitted while the scan is ongoing.
        Ongoing:
          type: boolean
          description: True while the scan is in progress; omitted once it has completed.
        Elapsed:
          type: string
          description: Duration string; time elapsed so far if ongoing, or total duration if completed, for example "15s".
        Error:
          type: string
          description: Error message if the scan ended in failure.
        AdsScanned:
          type: integer
          description: Number of advertisements walked during the chain scan.
        HeadAd:
          type: string
          description: String CID of the head advertisement at which the scan began.
        CurrentAd:
          type: string
          description: String CID of the advertisement most recently walked.
    SyncProcessingRun:
      type: object
      description: Progress of processing a synced advertisement stack.
      properties:
        StartTime:
          type: string
          format: date-time
          description: RFC3339 time at which processing started.
        EndTime:
          type: string
          format: date-time
          description: RFC3339 time at which processing ended; omitted while processing is ongoing.
        Ongoing:
          type: boolean
          description: True while processing is in progress; omitted once it has completed.
        Elapsed:
          type: string
          description: Duration string; time elapsed so far if ongoing, or total duration if completed.
        Error:
          type: string
          description: Error message if processing ended in failure.
        AdsProcessed:
          type: integer
          description: Number of advertisements processed so far, including the one currently in progress.
        AdsTotal:
          type: integer
          description: Total number of advertisements to process in this run.
        AdsLeft:
          type: integer
          description: Advertisements remaining; present only while AdsProcessed is less than AdsTotal.
        CurrentAd:
          type: string
          description: String CID of the advertisement currently being processed.
        ErrorCount:
          type: integer
          description: Number of advertisements that failed to ingest during this run.
    SyncDownloadRun:
      type: object
      description: |
        Progress of downloading advertisement entry data. One download run is
        shared across all advertisements processed within a single processing
        run, so its counts accumulate over the whole stack.
      properties:
        StartTime:
          type: string
          format: date-time
          description: RFC3339 time at which the download run started.
        EndTime:
          type: string
          format: date-time
          description: RFC3339 time at which the download run ended; omitted while the run is ongoing.
        Ongoing:
          type: boolean
          description: True while the download run is in progress; omitted once it has completed.
        Elapsed:
          type: string
          description: Duration string; time elapsed so far if ongoing, or total duration if completed.
        Error:
          type: string
          description: Error message if the download run ended in failure.
        BytesDownloaded:
          type: integer
          format: int64
          description: Total downloaded entry-block bytes.
        EntryChunkCount:
          type: integer
          description: Number of EntryChunk blocks indexed; HAMT entries are not chunked and do not contribute.
        ChunkMultihashCount:
          type: integer
          format: int64
          description: Multihashes indexed from EntryChunk blocks.
        HamtMultihashCount:
          type: integer
          format: int64
          description: Multihashes indexed from HAMT entries.
        MultihashCount:
          type: integer
          format: int64
          description: Total multihashes indexed; the sum of ChunkMultihashCount and HamtMultihashCount.
    AdStatus:
      type: object
      description: |
        Status of one advertisement: whether its content is available from
        this indexer, and if not, why. The provider of the advertisement is
        not included.

        In a batch response, an invalid CID produces an `Error` on that entry.
        Ignore the other fields on that entry.
      required:
        - Ad
        - Indexed
        - Frozen
      properties:
        Ad:
          type: string
          description: |
            The advertisement CID that was requested. If a batch item could
            not be decoded, this is the original string from the request.
        Indexed:
          type: boolean
          description: |
            True if this indexer can serve find results for the content in
            this advertisement. False if the advertisement is unknown, still
            being processed, was skipped, is being reprocessed, or was
            recorded without adding its content to the index.
        IndexedTime:
          type: string
          format: date-time
          description: |
            When this advertisement's content was last indexed, as UTC
            RFC3339 with microsecond precision. Omitted when `Indexed` is
            false, or when the indexer has no timestamp for it.
        State:
          type: string
          description: |
            What happened to this advertisement. Omitted when `Error` is set.

            * `unknown` — this indexer has not seen the advertisement.
            * `pending` — the advertisement is known but not finished yet.
            * `indexed` — processing finished. Check `Indexed` to see whether
              the content is actually available; it is not available when
              `Frozen` is true.
            * `skipped` — the advertisement was rejected and will not be
              indexed (for example, it was malformed).
            * `resyncing` — the advertisement is being processed again;
              previous results should not be relied on until it finishes.
          enum:
            - unknown
            - pending
            - indexed
            - skipped
            - resyncing
        SkipReason:
          type: string
          description: |
            Why the advertisement was skipped. Present only when `State` is
            `skipped`.
        SkippedTime:
          type: string
          format: date-time
          description: |
            When this advertisement was last skipped, as UTC RFC3339 with
            microsecond precision. Present only when `State` is `skipped` and
            the indexer has a timestamp for it.
        Frozen:
          type: boolean
          description: |
            True if the advertisement was recorded without adding its content
            to the index (for example, the indexer was not accepting new
            index data at the time). When `Frozen` is true, `Indexed` is
            false even if `State` is `indexed`.
        Error:
          type: string
          description: |
            Why this batch item could not be looked up, for example because
            the value is not a valid advertisement CID. Present only in batch
            responses. When set, ignore the other status fields on this entry.
    BatchAdStatusRequest:
      type: object
      required:
        - Ads
      properties:
        Ads:
          type: array
          minItems: 1
          maxItems: 128
          description: |
            Advertisement CIDs to look up. Results are returned in this order.
            The same CID may appear more than once.
          items:
            type: string
            description: An advertisement CID (dag-json or dag-cbor).
    BatchAdStatusResponse:
      type: object
      required:
        - Statuses
      properties:
        Statuses:
          type: array
          description: One status per requested CID, in the same order as `Ads`.
          items:
            $ref: '#/components/schemas/AdStatus'
  examples:
    NDJsonProviderRecords:
      summary: Streaming provider records response
      value: |
        {"ContextID":"aXBmcy1kaHQtY2FzY2FkZQ==","Metadata":"gBI=","Provider":{"ID":"12D3KooWHVXoJnv2ifmr9K6LWwJPXxkfvzZRHzjiTZMvybeTnwPy","Addrs":["/ip4/145.40.89.101/tcp/4001","/ip4/145.40.89.101/tcp/4002/ws","/ip4/145.40.89.101/udp/4001/quic","/ip6/2604:1380:45f1:d800::1/tcp/4001","/ip6/2604:1380:45f1:d800::1/tcp/4002/ws","/ip6/2604:1380:45f1:d800::1/udp/4001/quic"]}}
        
        {"ContextID":"aXBmcy1kaHQtY2FzY2FkZQ==","Metadata":"gBI=","Provider":{"ID":"12D3KooWDpp7U7W9Q8feMZPPEpPP5FKXTUakLgnVLbavfjb9mzrT","Addrs":["/ip4/147.75.80.75/tcp/4001","/ip4/147.75.80.75/tcp/4002/ws","/ip4/147.75.80.75/udp/4001/quic","/ip6/2604:1380:4601:f600::5/tcp/4001","/ip6/2604:1380:4601:f600::5/tcp/4002/ws","/ip6/2604:1380:4601:f600::5/udp/4001/quic"]}}
        
        {"ContextID":"aXBmcy1kaHQtY2FzY2FkZQ==","Metadata":"gBI=","Provider":{"ID":"12D3KooWCrBiagtZMzpZePCr1tfBbrZTh4BRQf7JurRqNMRi8YHF","Addrs":["/ip4/147.75.87.65/tcp/4001","/ip4/147.75.87.65/tcp/4002/ws","/ip4/147.75.87.65/udp/4001/quic","/ip6/2604:1380:4601:f600::1/tcp/4001","/ip6/2604:1380:4601:f600::1/tcp/4002/ws","/ip6/2604:1380:4601:f600::1/udp/4001/quic"]}}
    JsonFindResponse:
      summary: Find response with single multihash
      value: |
