    SyncStatusMapResponse:
      summary: Sync statuses for multiple publishers, keyed by peer ID
      value: |
        {
          "12D3KooWHVXoJnv2ifmr9K6LWwJPXxkfvzZRHzjiTZMvybeTnwPy": {
