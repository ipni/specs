            },
            "Download": {
              "StartTime": "2026-06-30T15:04:06Z",
              "Ongoing": true,
              "Elapsed": "44s",
              "BytesDownloaded": 10485760,
              "EntryChunkCount": 130,
              "ChunkMultihashCount": 260000,
              "MultihashCount": 260000
            }
          },
          "12D3KooWDpp7U7W9Q8feMZPPEpPP5FKXTUakLgnVLbavfjb9mzrT": {
            "Provider": "12D3KooWDpp7U7W9Q8feMZPPEpPP5FKXTUakLgnVLbavfjb9mzrT",
            "ProcessingHistory": [
